<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="0.35" stop-color="#f8fafc"/>
      <stop offset="0.7" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2937"/><stop offset="0.4" stop-color="#4b5563"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="200" cy="352" rx="120" ry="14" fill="#000" opacity="0.18"/>
  <!-- tub body -->
  <path d="M95 110 H305 L295 340 Q295 352 283 352 H117 Q105 352 105 340 Z" fill="url(#body)"/>
  <!-- lid -->
  <rect x="85" y="62" width="230" height="54" rx="10" fill="url(#lid)"/>
  <rect x="85" y="104" width="230" height="10" fill="#000" opacity="0.25"/>
  <g stroke="#000" stroke-opacity="0.25" stroke-width="2">
    <line x1="110" y1="68" x2="110" y2="110"/><line x1="140" y1="68" x2="140" y2="110"/><line x1="170" y1="68" x2="170" y2="110"/>
    <line x1="230" y1="68" x2="230" y2="110"/><line x1="260" y1="68" x2="260" y2="110"/><line x1="290" y1="68" x2="290" y2="110"/>
  </g>
  <!-- label -->
  <rect x="104" y="150" width="192" height="158" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="104" y="150" width="192" height="34" rx="8" fill="#0284c7"/>
  <rect x="104" y="170" width="192" height="14" fill="#0284c7"/>
  <text x="200" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#fff" letter-spacing="2">NOVATECH</text>
  <text x="200" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#0f172a">WHEY</text>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900" fill="#0284c7">ISOLATE</text>
  <rect x="130" y="264" width="140" height="2" fill="#cbd5e1"/>
  <text x="200" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#475569">Vanilla Ice Cream</text>
  <text x="200" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">100% Whey Protein</text>
  <!-- flavour chip -->
  <circle cx="276" cy="140" r="26" fill="#0284c7" stroke="#fff" stroke-width="4"/>
  <text x="276" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="900" fill="#fff">25g</text>
  <text x="276" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#fff">PROTEIN</text>
  <!-- shine -->
  <path d="M130 116 H160 L155 345 H135 Z" fill="url(#shine)"/>
</svg>
